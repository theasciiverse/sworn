[package]
name = "sworn"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Asciiverse multiplayer medieval politics for the terminal, Rust + Ratatui"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sworn"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
log = "0.4"
env_logger = "0.11"
ratatui = "0.30"
iroh = "1.0.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
debug = 1
